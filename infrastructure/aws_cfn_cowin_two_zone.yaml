AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IT457 Cloud Computing - CoWIN Case Study Week 3 PoC:
  Two-Zone High-Availability Architecture with Application Load Balancer
  and Automated Failover on Amazon Web Services (ap-south-1).
  Each node bootstraps itself at first boot by fetching the pinned
  application artifact from the project repository (see AppRepoRef);
  the template embeds no application copies.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t4g.micro, t2.micro]
    Description: EC2 Instance Type for lookup service nodes

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: SSM Parameter to automatically fetch latest Amazon Linux 2023 AMI

  AppRepoOwner:
    Type: String
    Default: kaushalnandaniya
    Description: GitHub owner of the application artifact fetched at boot

  AppRepoName:
    Type: String
    Default: CoWIN
    Description: GitHub repository of the application artifact fetched at boot

  ZoneAPrivateIp:
    Type: String
    Default: 10.0.1.150
    Description: >
      Free static address in 10.0.1.0/24 for logical Zone A. UPDATE RULE:
      bootstrap/IP changes replace BOTH nodes via launch-template versions.
      Supply fresh free addresses for BOTH ZoneAPrivateIp and ZoneBPrivateIp
      before any replacing update, including migration from the old template,
      AppRepoRef/UserData, KeyName or AMI updates. CloudFormation creates new
      nodes before deleting old ones; reusing occupied addresses fails.
      Reinstall the API key over SSH on BOTH replacement nodes. See runbook.

  ZoneBPrivateIp:
    Type: String
    Default: 10.0.2.150
    Description: >
      Free static address in 10.0.2.0/24 for logical Zone B. Follow the SAME
      BOTH-node replacement/update rule as ZoneAPrivateIp. A one-IP-only
      update is unsafe: the other replacement would reuse an occupied IP.

  AppRepoRef:
    Type: String
    Default: main
    Description: >
      Git ref of the pinned application artifact (service/app.py,
      centers_data.json, static/) fetched by each node at boot. Pin to a
      commit SHA for reproducible deploys; deploy_aws.sh pins the checked
      out HEAD automatically.

  OperatorKeyPair:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: >
      Existing EC2 key pair that grants operator SSH access. Required:
      /simulate drills reach the nodes through SSH tunnels (ssh -L),
      never through the public ALB. Holders of this key pair are the
      only operators; keep it offline and share it out-of-band.

  OperatorSshCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: must be a single operator IP in /32 CIDR form
    Description: >
      The ONE operator IP allowed to reach port 22, in /32 CIDR form
      (for example 203.0.113.10/32). There is no default: port 22 is
      never opened to the world. Update the stack when the operator IP
      changes.

Resources:
  # =========================================================================
  # 1. NETWORKING LAYER (VPC, Subnets, Gateway, Route Tables)
  # =========================================================================
  CoWINVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: CoWIN-PoC-VPC
        - Key: Project
          Value: IT457-CoWIN

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CoWIN-PoC-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CoWINVPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoWINVPC
      Tags:
        - Key: Name
          Value: CoWIN-Public-RouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Availability Zone A Subnet (e.g. ap-south-1a)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CoWINVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CoWIN-Public-Subnet-ZoneA

  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref RouteTable

  # Availability Zone B Subnet (e.g. ap-south-1b)
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CoWINVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CoWIN-Public-Subnet-ZoneB

  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref RouteTable

  # =========================================================================
  # 2. SECURITY GROUPS (Defense-in-depth isolation)
  # =========================================================================
  # ALB Security Group: Inbound HTTP 80 from anywhere
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP from clients to ALB
      VpcId: !Ref CoWINVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CoWIN-ALB-SG

  # Instance Security Group: Inbound HTTP 8080 ONLY from ALB
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP traffic only from Application Load Balancer
      VpcId: !Ref CoWINVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Operator SSH for /simulate drills (ssh -L tunnels) and for
        # setting the API key post-boot. Scoped to one operator /32,
        # never open to the world.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref OperatorSshCidr
      Tags:
        - Key: Name
          Value: CoWIN-Instance-SG

  # Node-to-node access for the cross-zone interlock: each node probes
  # the peer's /health on its pinned private IP before accepting a
  # simulated failure. Kept as a separate resource because a security
  # group cannot reference its own inline ingress rule.
  InstanceSecurityGroupPeerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref InstanceSecurityGroup

  # =========================================================================
  # 3. APPLICATION LOAD BALANCER & TARGET GROUP
  # =========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cowin-lookup-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-PoC-ALB

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cowin-lookup-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref CoWINVPC
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckPort: '8080'
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Targets:
        - Id: !Ref InstanceZoneA
          Port: 8080
        - Id: !Ref InstanceZoneB
          Port: 8080
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-TG

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # Default-deny at the edge: the failure-injection controls are never
  # public on a fresh deploy. Failover tests use stop/start of the Zone A
  # instance (deploy_aws.sh fail-zone-a), which needs no inbound access.
  ALBSimulateDenyRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /simulate/*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: application/json
            MessageBody: '{"error":"Forbidden","message":"Simulation controls are disabled at the load balancer"}'

  # =========================================================================
  # 4. COMPUTE NODES (Redundant EC2 Instances across Zone A and Zone B)
  # =========================================================================
  InstanceZoneA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref OperatorKeyPair
      SubnetId: !Ref PublicSubnetA
      PrivateIpAddress: !Ref ZoneAPrivateIp
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-ZoneA
        - Key: Zone
          Value: Zone-A
      LaunchTemplate:
        LaunchTemplateId: !Ref BootstrapZoneA
        Version: !GetAtt BootstrapZoneA.LatestVersionNumber

  # A new version forces EC2 replacement, so cloud-init actually reruns.
  BootstrapZoneA:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # Network identity: A=${ZoneAPrivateIp} B=${ZoneBPrivateIp}
            yum update -y
            yum install -y python3
            mkdir -p /opt/cowin/static

            # Fetch the pinned application artifact (service code, dataset, UI assets)
            # instead of embedding drifting copies in this template.
            BASE_URL="https://raw.githubusercontent.com/${AppRepoOwner}/${AppRepoName}/${AppRepoRef}/service"
            fetch() { curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$1" -o "$2"; }
            fetch "$BASE_URL/app.py" /opt/cowin/app.py
            fetch "$BASE_URL/pages.py" /opt/cowin/pages.py
            fetch "$BASE_URL/centers_data.json" /opt/cowin/centers_data.json
            for asset in index.html styles.css app.js admin.html admin.css admin.js; do
              fetch "$BASE_URL/static/$asset" "/opt/cowin/static/$asset"
            done

            # Get IMDSv2 token & instance metadata
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

            cat << EOF > /etc/systemd/system/cowin.service
            [Unit]
            Description=CoWIN Lookup Microservice
            After=network.target

            [Service]
            Type=simple
            Environment="AWS_AZ=$AZ"
            Environment="AWS_INSTANCE_ID=$IID"
            EnvironmentFile=-/etc/default/cowin-lookup
            ExecStart=/usr/bin/python3 /opt/cowin/app.py
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            mkdir -p /etc/default
            cat << 'CONF' > /etc/default/cowin-lookup
            # Service configuration (see service/README.md).
            # COWIN_API_KEY is deliberately NOT written here: UserData is
            # readable via the console/describe-instances, so the operator
            # sets the key over SSH after boot instead (see the operator
            # runbook in service/README.md). Until then the node runs in
            # dev mode; /simulate/* stays unreachable anyway behind the
            # ALB's 403 and the scoped security group.
            #COWIN_API_KEY=set-me-over-ssh
            COWIN_ZONE_LETTER=a
            # Cross-zone interlock: refuse /simulate/fail while the peer
            # zone is unhealthy or unreachable. Points at the peer node's
            # pinned private IP, so there is no boot-time dependency
            # between the two instances.
            COWIN_PEER_URL=http://${ZoneBPrivateIp}:8080
            # Per-client-IP rate limiting (0 = disabled):
            #RATE_LIMIT_RPS=50
            #RATE_LIMIT_BURST=100
            #CENTERS_DB_FILE=/opt/cowin/centers.db
            CONF

            systemctl daemon-reload
            systemctl enable cowin
            systemctl start cowin

  InstanceZoneB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref OperatorKeyPair
      SubnetId: !Ref PublicSubnetB
      PrivateIpAddress: !Ref ZoneBPrivateIp
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-ZoneB
        - Key: Zone
          Value: Zone-B
      LaunchTemplate:
        LaunchTemplateId: !Ref BootstrapZoneB
        Version: !GetAtt BootstrapZoneB.LatestVersionNumber

  # A new version forces EC2 replacement, so cloud-init actually reruns.
  BootstrapZoneB:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # Network identity: A=${ZoneAPrivateIp} B=${ZoneBPrivateIp}
            yum update -y
            yum install -y python3
            mkdir -p /opt/cowin/static

            # Fetch the pinned application artifact (service code, dataset, UI assets)
            # instead of embedding drifting copies in this template.
            BASE_URL="https://raw.githubusercontent.com/${AppRepoOwner}/${AppRepoName}/${AppRepoRef}/service"
            fetch() { curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$1" -o "$2"; }
            fetch "$BASE_URL/app.py" /opt/cowin/app.py
            fetch "$BASE_URL/pages.py" /opt/cowin/pages.py
            fetch "$BASE_URL/centers_data.json" /opt/cowin/centers_data.json
            for asset in index.html styles.css app.js admin.html admin.css admin.js; do
              fetch "$BASE_URL/static/$asset" "/opt/cowin/static/$asset"
            done

            # Get IMDSv2 token & instance metadata
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

            cat << EOF > /etc/systemd/system/cowin.service
            [Unit]
            Description=CoWIN Lookup Microservice
            After=network.target

            [Service]
            Type=simple
            Environment="AWS_AZ=$AZ"
            Environment="AWS_INSTANCE_ID=$IID"
            EnvironmentFile=-/etc/default/cowin-lookup
            ExecStart=/usr/bin/python3 /opt/cowin/app.py
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            mkdir -p /etc/default
            cat << 'CONF' > /etc/default/cowin-lookup
            # Service configuration (see service/README.md).
            # COWIN_API_KEY is deliberately NOT written here: the operator
            # sets it over SSH after boot (see the Zone A UserData comment
            # and the operator runbook in service/README.md).
            #COWIN_API_KEY=set-me-over-ssh
            COWIN_ZONE_LETTER=b
            # Cross-zone interlock: refuse /simulate/fail while the peer
            # zone is unhealthy or unreachable (peer's pinned private IP).
            COWIN_PEER_URL=http://${ZoneAPrivateIp}:8080
            # Per-client-IP rate limiting (0 = disabled):
            #RATE_LIMIT_RPS=50
            #RATE_LIMIT_BURST=100
            #CENTERS_DB_FILE=/opt/cowin/centers.db
            CONF

            systemctl daemon-reload
            systemctl enable cowin
            systemctl start cowin

Outputs:
  VPCId:
    Description: VPC Identifier
    Value: !Ref CoWINVPC

  LoadBalancerURL:
    Description: Public URL of the Application Load Balancer
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  LoadBalancerDNSName:
    Description: ALB DNS Hostname for Benchmarking
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the Target Group (for inspecting target health states)
    Value: !Ref ALBTargetGroup

  InstanceAZoneAId:
    Description: EC2 Instance ID in Zone A (target to stop during failover test)
    Value: !Ref InstanceZoneA

  InstanceBZoneBId:
    Description: EC2 Instance ID in Zone B (redundant survivor instance)
    Value: !Ref InstanceZoneB


