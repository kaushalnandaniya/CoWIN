AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IT457 Cloud Computing - CoWIN Case Study Week 3 PoC:
  Two-Zone High-Availability Architecture with Application Load Balancer
  and Automated Failover on Amazon Web Services (ap-south-1).
  Each node bootstraps itself at first boot by fetching the pinned
  application artifact from the project repository (see AppRepoRef);
  the template embeds no application copies.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t4g.micro, t2.micro]
    Description: EC2 Instance Type for lookup service nodes

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: SSM Parameter to automatically fetch latest Amazon Linux 2023 AMI

  AppRepoOwner:
    Type: String
    Default: kaushalnandaniya
    Description: GitHub owner of the application artifact fetched at boot

  AppRepoName:
    Type: String
    Default: CoWIN
    Description: GitHub repository of the application artifact fetched at boot

  ZoneAPrivateIp:
    Type: String
    Default: 10.0.1.150
    Description: >
      Static private IP for the Zone A node. Pinned so the peer zone's
      COWIN_PEER_URL never has to resolve the other instance at boot
      (which would create a mutual resource dependency). Must be FREE in
      subnet 10.0.1.0/24: check the current assignment before deploying
      and override this parameter if it is taken.

  ZoneBPrivateIp:
    Type: String
    Default: 10.0.2.150
    Description: >
      Static private IP for the Zone B node. Must be FREE in subnet
      10.0.2.0/24 (see ZoneAPrivateIp).

  AppRepoRef:
    Type: String
    Default: main
    Description: >
      Git ref of the pinned application artifact (service/app.py,
      centers_data.json, static/) fetched by each node at boot. Pin to a
      commit SHA for reproducible deploys; deploy_aws.sh pins the checked
      out HEAD automatically.

  COWINApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Required API key for the mutating /simulate/* endpoints, written to
      /etc/default/cowin-lookup on each node. There is no default: a fresh
      deploy must never expose the simulation controls unauthenticated.

Resources:
  # =========================================================================
  # 1. NETWORKING LAYER (VPC, Subnets, Gateway, Route Tables)
  # =========================================================================
  CoWINVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: CoWIN-PoC-VPC
        - Key: Project
          Value: IT457-CoWIN

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CoWIN-PoC-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CoWINVPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoWINVPC
      Tags:
        - Key: Name
          Value: CoWIN-Public-RouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Availability Zone A Subnet (e.g. ap-south-1a)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CoWINVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CoWIN-Public-Subnet-ZoneA

  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref RouteTable

  # Availability Zone B Subnet (e.g. ap-south-1b)
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CoWINVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: CoWIN-Public-Subnet-ZoneB

  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref RouteTable

  # =========================================================================
  # 2. SECURITY GROUPS (Defense-in-depth isolation)
  # =========================================================================
  # ALB Security Group: Inbound HTTP 80 from anywhere
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP from clients to ALB
      VpcId: !Ref CoWINVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CoWIN-ALB-SG

  # Instance Security Group: Inbound HTTP 8080 ONLY from ALB
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP traffic only from Application Load Balancer
      VpcId: !Ref CoWINVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-Instance-SG

  # Node-to-node access for the cross-zone interlock: each node probes
  # the peer's /health on its pinned private IP before accepting a
  # simulated failure. Kept as a separate resource because a security
  # group cannot reference its own inline ingress rule.
  InstanceSecurityGroupPeerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref InstanceSecurityGroup

  # =========================================================================
  # 3. APPLICATION LOAD BALANCER & TARGET GROUP
  # =========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cowin-lookup-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-PoC-ALB

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cowin-lookup-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref CoWINVPC
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckPort: '8080'
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Targets:
        - Id: !Ref InstanceZoneA
          Port: 8080
        - Id: !Ref InstanceZoneB
          Port: 8080
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-TG

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # Default-deny at the edge: the failure-injection controls are never
  # public on a fresh deploy. Failover tests use stop/start of the Zone A
  # instance (deploy_aws.sh fail-zone-a), which needs no inbound access.
  ALBSimulateDenyRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /simulate/*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: application/json
            MessageBody: '{"error":"Forbidden","message":"Simulation controls are disabled at the load balancer"}'

  # =========================================================================
  # 4. COMPUTE NODES (Redundant EC2 Instances across Zone A and Zone B)
  # =========================================================================
  InstanceZoneA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnetA
      PrivateIpAddress: !Ref ZoneAPrivateIp
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-ZoneA
        - Key: Zone
          Value: Zone-A
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          yum update -y
          yum install -y python3
          mkdir -p /opt/cowin/static

          # Fetch the pinned application artifact (service code, dataset, UI assets)
          # instead of embedding drifting copies in this template.
          BASE_URL="https://raw.githubusercontent.com/${AppRepoOwner}/${AppRepoName}/${AppRepoRef}/service"
          fetch() { curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$1" -o "$2"; }
          fetch "$BASE_URL/app.py" /opt/cowin/app.py
          fetch "$BASE_URL/pages.py" /opt/cowin/pages.py
          fetch "$BASE_URL/centers_data.json" /opt/cowin/centers_data.json
          for asset in index.html styles.css app.js admin.html admin.css admin.js; do
            fetch "$BASE_URL/static/$asset" "/opt/cowin/static/$asset"
          done

          # Get IMDSv2 token & instance metadata
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
          IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

          cat << EOF > /etc/systemd/system/cowin.service
          [Unit]
          Description=CoWIN Lookup Microservice
          After=network.target

          [Service]
          Type=simple
          Environment="AWS_AZ=$AZ"
          Environment="AWS_INSTANCE_ID=$IID"
          EnvironmentFile=-/etc/default/cowin-lookup
          ExecStart=/usr/bin/python3 /opt/cowin/app.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          mkdir -p /etc/default
          cat << 'CONF' > /etc/default/cowin-lookup
          # Service configuration (see service/README.md).
          COWIN_API_KEY=${COWINApiKey}
          # Cross-zone interlock: refuse /simulate/fail while the peer
          # zone is unhealthy or unreachable. Points at the peer node's
          # pinned private IP, so there is no boot-time dependency
          # between the two instances.
          COWIN_PEER_URL=http://${ZoneBPrivateIp}:8080
          # Per-client-IP rate limiting (0 = disabled):
          #RATE_LIMIT_RPS=50
          #RATE_LIMIT_BURST=100
          #CENTERS_DB_FILE=/opt/cowin/centers.db
          CONF

          systemctl daemon-reload
          systemctl enable cowin
          systemctl start cowin

  InstanceZoneB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnetB
      PrivateIpAddress: !Ref ZoneBPrivateIp
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: CoWIN-Lookup-ZoneB
        - Key: Zone
          Value: Zone-B
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          yum update -y
          yum install -y python3
          mkdir -p /opt/cowin/static

          # Fetch the pinned application artifact (service code, dataset, UI assets)
          # instead of embedding drifting copies in this template.
          BASE_URL="https://raw.githubusercontent.com/${AppRepoOwner}/${AppRepoName}/${AppRepoRef}/service"
          fetch() { curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$1" -o "$2"; }
          fetch "$BASE_URL/app.py" /opt/cowin/app.py
          fetch "$BASE_URL/pages.py" /opt/cowin/pages.py
          fetch "$BASE_URL/centers_data.json" /opt/cowin/centers_data.json
          for asset in index.html styles.css app.js admin.html admin.css admin.js; do
            fetch "$BASE_URL/static/$asset" "/opt/cowin/static/$asset"
          done

          # Get IMDSv2 token & instance metadata
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
          IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

          cat << EOF > /etc/systemd/system/cowin.service
          [Unit]
          Description=CoWIN Lookup Microservice
          After=network.target

          [Service]
          Type=simple
          Environment="AWS_AZ=$AZ"
          Environment="AWS_INSTANCE_ID=$IID"
          EnvironmentFile=-/etc/default/cowin-lookup
          ExecStart=/usr/bin/python3 /opt/cowin/app.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          mkdir -p /etc/default
          cat << 'CONF' > /etc/default/cowin-lookup
          # Service configuration (see service/README.md).
          COWIN_API_KEY=${COWINApiKey}
          # Cross-zone interlock: refuse /simulate/fail while the peer
          # zone is unhealthy or unreachable (peer's pinned private IP).
          COWIN_PEER_URL=http://${ZoneAPrivateIp}:8080
          # Per-client-IP rate limiting (0 = disabled):
          #RATE_LIMIT_RPS=50
          #RATE_LIMIT_BURST=100
          #CENTERS_DB_FILE=/opt/cowin/centers.db
          CONF

          systemctl daemon-reload
          systemctl enable cowin
          systemctl start cowin

Outputs:
  VPCId:
    Description: VPC Identifier
    Value: !Ref CoWINVPC

  LoadBalancerURL:
    Description: Public URL of the Application Load Balancer
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  LoadBalancerDNSName:
    Description: ALB DNS Hostname for Benchmarking
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the Target Group (for inspecting target health states)
    Value: !Ref ALBTargetGroup

  InstanceAZoneAId:
    Description: EC2 Instance ID in Zone A (target to stop during failover test)
    Value: !Ref InstanceZoneA

  InstanceBZoneBId:
    Description: EC2 Instance ID in Zone B (redundant survivor instance)
    Value: !Ref InstanceZoneB


